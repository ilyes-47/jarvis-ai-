<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title><style><link rel="stylesheet" href="style.css">
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body { 
    <script src="script.js"></script>
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 20%, #12384a 0%, #06131b 35%, #02070b 75%);
    color: #dffaff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* ---------- HEADER ---------- */

header {
    height: 75px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    border-bottom: 1px solid rgba(90,220,255,.18);
    background: rgba(2,10,15,.65);
    backdrop-filter: blur(12px);
}

.logo {
    font-size: 22px;
    letter-spacing: 6px;
    color: #8deaff;
    text-shadow: 0 0 15px #00cfff;
}

.status {
    font-size: 11px;
    letter-spacing: 2px;
    color: #67e8ff;
}

.status::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-right: 8px;
    border-radius: 50%;
    background: #52f0a8;
    box-shadow: 0 0 10px #52f0a8;
}

/* ---------- MAIN ---------- */

main {
    height: calc(100vh - 75px);
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* ---------- ARC REACTOR ---------- */

.core {
    position: relative;
    width: 190px;
    height: 190px;
    margin-top: 25px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid #4ddfff;
    box-shadow:
        0 0 15px rgba(0,210,255,.5),
        inset 0 0 15px rgba(0,210,255,.2);
}

.ring.one {
    width: 180px;
    height: 180px;
    animation: rotate 15s linear infinite;
}

.ring.two {
    width: 145px;
    height: 145px;
    border-style: dashed;
    animation: rotateReverse 9s linear infinite;
}

.ring.three {
    width: 110px;
    height: 110px;
    border-color: #9df5ff;
    box-shadow: 0 0 30px #00d9ff;
}

.core-light {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: #c9faff;
    box-shadow:
        0 0 15px #fff,
        0 0 35px #00e5ff,
        0 0 70px #00bfff;
    animation: pulse 2s ease-in-out infinite;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes rotateReverse {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
}

@keyframes pulse {
    0%,100% { transform: scale(.9); opacity: .8; }
    50% { transform: scale(1.08); opacity: 1; }
}

/* ---------- GREETING ---------- */

.greeting {
    text-align: center;
    margin: 5px 20px 15px;
}

.greeting h1 {
    font-size: 26px;
    font-weight: 400;
    letter-spacing: 3px;
}

.greeting p {
    margin-top: 7px;
    color: #7faab5;
    font-size: 13px;
}

/* ---------- CHAT ---------- */

.chat {
    width: min(900px, 94%);
    flex: 1;
    min-height: 160px;
    overflow-y: auto;
    padding: 10px 5px 15px;
    scroll-behavior: smooth;
}

.message {
    max-width: 82%;
    padding: 12px 16px;
    margin: 9px 0;
    border-radius: 15px;
    line-height: 1.5;
    font-size: 14px;
    animation: appear .25s ease;
}

.jarvis {
    margin-right: auto;
    background: rgba(18,54,67,.65);
    border: 1px solid rgba(83,219,255,.18);
}

.user {
    margin-left: auto;
    background: rgba(0,140,180,.18);
    border: 1px solid rgba(83,219,255,.25);
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ---------- INPUT ---------- */

.input-area {
    width: min(900px, 94%);
    display: flex;
    gap: 8px;
    padding: 10px 0 18px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 15px;
    border-radius: 14px;
    border: 1px solid rgba(90,220,255,.25);
    outline: none;
    background: rgba(2,18,25,.85);
    color: white;
    font-size: 14px;
}

input:focus {
    border-color: #49ddff;
    box-shadow: 0 0 15px rgba(0,200,255,.15);
}

button {
    border: 1px solid rgba(90,220,255,.35);
    background: rgba(10,48,60,.8);
    color: #a9f2ff;
    border-radius: 14px;
    padding: 0 16px;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    background: rgba(20,90,110,.8);
    box-shadow: 0 0 15px rgba(0,210,255,.25);
}

.mic {
    width: 52px;
    font-size: 19px;
}

.settings {
    width: 52px;
    font-size: 18px;
}

/* ---------- SETTINGS ---------- */

.panel {
    position: fixed;
    right: -330px;
    top: 0;
    width: 320px;
    height: 100vh;
    padding: 25px;
    background: rgba(3,16,23,.96);
    border-left: 1px solid rgba(90,220,255,.25);
    transition: .35s;
    z-index: 10;
    backdrop-filter: blur(20px);
}

.panel.open {
    right: 0;
}

.panel h2 {
    color: #8deaff;
    margin-bottom: 25px;
    letter-spacing: 2px;
}

.setting {
    margin-bottom: 22px;
}

.setting label {
    display: block;
    color: #8faeb6;
    font-size: 12px;
    margin-bottom: 8px;
}

select,
.panel input {
    width: 100%;
    padding: 11px;
    border-radius: 9px;
    background: #071b24;
    color: white;
    border: 1px solid rgba(90,220,255,.25);
}

.close {
    float: right;
    font-size: 20px;
    cursor: pointer;
}

/* ---------- MOBILE ---------- */

@media(max-width:600px) {
    .logo {
        font-size: 18px;
    }

    .core {
        width: 150px;
        height: 150px;
    }

    .ring.one {
        width: 145px;
        height: 145px;
    }

    .ring.two {
        width: 115px;
        height: 115px;
    }

    .ring.three {
        width: 85px;
        height: 85px;
    }

    .core-light {
        width: 48px;
        height: 48px;
    }

    .greeting h1 {
        font-size: 21px;
    }

    .message {
        max-width: 90%;
    }
}
</style></head><body><header>
    <div class="logo">JARVIS</div>
    <div class="status">ONLINE</div>
</header><main><div class="core">
    <div class="ring one"></div>
    <div class="ring two"></div>
    <div class="ring three"></div>
    <div class="core-light"></div>
</div>

<div class="greeting">
    <h1>Good evening, Sir.</h1>
    <p>Your personal assistant is ready.</p>
</div>

<div class="chat" id="chat">

    <div class="message jarvis">
        Good evening, Sir. JARVIS systems are online.
        How may I assist you?
    </div>

</div>

<div class="input-area">

    <button class="settings" onclick="toggleSettings()">⚙</button>

    <input
        id="input"
        type="text"
        placeholder="Speak to JARVIS..."
        autocomplete="off"
    >

    <button class="mic" onclick="listen()">🎙</button>

    <button onclick="send()">SEND</button>

</div>

</main><!-- SETTINGS PANEL --><div class="panel" id="panel"><span class="close" onclick="toggleSettings()">✕</span>

<h2>JARVIS SETTINGS</h2>

<div class="setting">
    <label>Voice</label>
    <select id="voiceSelect"></select>
</div>

<div class="setting">
    <label>Speech speed</label>
    <input
        id="speed"
        type="range"
        min="0.6"
        max="1.4"
        value="0.95"
        step="0.05"
    >
</div>

<div class="setting">
    <label>Personality</label>
    <select id="personality">
        <option>Calm</option>
        <option>Normal</option>
        <option>Energetic</option>
    </select>
</div>

<button onclick="clearMemory()" style="width:100%;padding:12px;">
    CLEAR MEMORY
</button>

</div><script>

/* =========================================
   JARVIS CORE
========================================= */

const input = document.getElementById("input");
const chat = document.getElementById("chat");

let memories =
    JSON.parse(localStorage.getItem("jarvisMemory") || "[]");

let voices = [];


/* =========================================
   VOICES
========================================= */

function loadVoices() {

    voices = speechSynthesis.getVoices();

    const select = document.getElementById("voiceSelect");

    select.innerHTML = "";

    voices.forEach((voice, index) => {

        const option = document.createElement("option");

        option.value = index;

        option.textContent =
            voice.name + " — " + voice.lang;

        select.appendChild(option);

    });
}

speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();


/* =========================================
   SPEAK
========================================= */

function speak(text) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    const selected =
        document.getElementById("voiceSelect").value;

    if (voices[selected]) {
        utterance.voice = voices[selected];
    }

    utterance.rate =
        Number(document.getElementById("speed").value);

    utterance.pitch = 0.85;

    speechSynthesis.speak(utterance);
}


/* =========================================
   ADD MESSAGE
========================================= */

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent = text;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}


/* =========================================
   SEND
========================================= */

function send() {

    const text =
        input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";

    const response =
        jarvisResponse(text);

    setTimeout(() => {

        addMessage(response, "jarvis");

        speak(response);

    }, 350);
}


/* =========================================
   ENTER KEY
========================================= */

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        send();
    }

});


/* =========================================
   BASIC JARVIS BRAIN
========================================= */

function jarvisResponse(text) {

    const lower =
        text.toLowerCase();


    /* MEMORY */

    if (
        lower.startsWith("remember ") ||
        lower.startsWith("remember that ")
    ) {

        let memory =
            text
            .replace(/^remember that /i, "")
            .replace(/^remember /i, "")
            .trim();

        if (memory) {

            memories.push(memory);

            localStorage.setItem(
                "jarvisMemory",
                JSON.stringify(memories)
            );

            return "Understood, Sir. I will remember that.";
        }
    }


    /* SHOW MEMORY */

    if (
        lower.includes("what do you remember") ||
        lower.includes("show my memories")
    ) {

        if (memories.length === 0) {
            return "I don't have any saved memories yet, Sir.";
        }

        return "I remember: " +
            memories.join(", ") + ".";
    }


    /* FORGET */

    if (lower.startsWith("forget ")) {

        const target =
            text.substring(7).trim().toLowerCase();

        const before =
            memories.length;

        memories =
            memories.filter(
                item => item.toLowerCase() !== target
            );

        localStorage.setItem(
            "jarvisMemory",
            JSON.stringify(memories)
        );

        if (memories.length < before) {
            return "Understood, Sir. I have forgotten it.";
        }

        return "I couldn't find that exact memory, Sir.";
    }


    /* GREETINGS */

    if (
        lower.includes("hello") ||
        lower.includes("hi jarvis") ||
        lower.includes("hey jarvis")
    ) {

        return "Hello, Sir. It is good to hear from you.";
    }


    /* STATUS */

    if (
        lower.includes("how are you") ||
        lower.includes("status")
    ) {

        return "All systems are operational, Sir.";
    }


    /* TIME */

    if (lower.includes("time")) {

        return "The current time is " +
            new Date().toLocaleTimeString();
    }


    /* DATE */

    if (
        lower.includes("date") ||
        lower.includes("today")
    ) {

        return "Today is " +
            new Date().toLocaleDateString();
    }


    /* THANKS */

    if (
        lower.includes("thank you") ||
        lower.includes("thanks")
    ) {

        return "You're welcome, Sir.";
    }


    /* DEFAULT */

    const personality =
        document.getElementById("personality").value;

    if (personality === "Energetic") {

        return "I'm listening, Sir. Give me the objective.";

    }

    if (personality === "Calm") {

        return "Understood, Sir. I'm listening.";

    }

    return "Understood, Sir. How would you like me to proceed?";
}


/* =========================================
   MICROPHONE
========================================= */

function listen() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        addMessage(
            "Voice recognition isn't supported by this browser.",
            "jarvis"
        );

        return;
    }

    const recognition =
        new SpeechRecognition();

    recognition.lang = "en-US";

    recognition.interimResults = false;

    recognition.maxAlternatives = 1;

    recognition.start();

    recognition.onstart = function() {

        addMessage(
            "Listening, Sir...",
            "jarvis"
        );

    };

    recognition.onresult = function(event) {

        const transcript =
            event.results[0][0].transcript;

        input.value = transcript;

        send();

    };

    recognition.onerror = function() {

        addMessage(
            "I couldn't hear that clearly, Sir.",
            "jarvis"
        );

    };

}


/* =========================================
   SETTINGS
========================================= */

function toggleSettings() {

    document
        .getElementById("panel")
        .classList.toggle("open");

}


/* =========================================
   CLEAR MEMORY
========================================= */

function clearMemory() {

    memories = [];

    localStorage.removeItem("jarvisMemory");

    addMessage(
        "Memory cleared, Sir.",
        "jarvis"
    );

    speak("Memory cleared, Sir.");

}

</script></body>
</html>
